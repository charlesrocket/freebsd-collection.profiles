---
name: CI
"on": [push, pull_request]

jobs:
  lint:
    name: Lint
    if: forgejo.ref_type != 'tag'
    runs-on: codeberg-tiny
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Lint YAML
        run: pipx run yamllint .
