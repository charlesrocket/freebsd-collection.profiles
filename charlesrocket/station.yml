---

# Dotfiles
dotfiles_dfs: true
dotfiles_dfs_config: "https://raw.githubusercontent.com/charlesrocket/dotfiles\
/refs/heads/trunk/.config/dfs/config.zon"

# Git
git_repo_destination: ~/src/git
git_repo_shallow: true
git_helper_directory: ~/bin
git_helper:
  - libsecret

# Configuration
laptop: true
laptop_thinkpad: true
laptop_dock: false

desktop_notifications_service: dunst
desktop_ohmyzsh: true
desktop_acpi: true

asus: false
amd: false
clamav: true
bastille: true
intel: true
virtualbox: true
wifi: true
mfa: true

emacs_doom: true
emacs_languagetool: true
emacs_wayland: true

wg_enabled: true

bastille_zfs_enable: true
bastille_zfs_zpool: zroot
tethering_apple: true
timezone: America/Los_Angeles

qmk: true
qmk_userspace: "https://github.com/charlesrocket/qmk_userspace"
qmk_userspace_version: "trunk"
qmk_firmware_location: "~/src/qmk_firmware"

sys_microcode_update: true
sys_ipv6_support: true
sys_boot_verbose: true
sys_coretemp: true
sys_cpuctl: true
sys_aesni: true

common_lynis_profile: desktop
make_config:
  - DEVELOPER=yes
  - MAKE_JOBS_NUMBER?=16

user_shell: /usr/local/bin/zsh
user_groups:
  - cups
  - dialer
  - network
  - operator
  - realtime
  - video
  - wheel

drm_module: "drm-kmod"

# Manage src/ports/doc with git
git_ports: false
git_src: false
git_doc: false

